[project]
name = "blobquant"
version = "0.1.0"
description = "Segment 3D blobs from a static volume and quantify per-blob fluorescence intensity across a time series"
readme = "README.md"
authors = [
    { name = "candy", email = "dikang13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy<1.14",
    "scikit-image>=0.22",
    "h5py>=3.10",
    "tifffile>=2024.1.30",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4",
    "hdbscan>=0.8.33",
    "SimpleITK>=2.3",
    "imageio>=2.34",
    "matplotlib>=3.8",
    "pytorch3dunet",
]

[tool.uv.sources]
pytorch3dunet = { path = "pytorch-3dunet", editable = true }

[project.scripts]
blobquant = "blobquant.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
